{% extends 'base.html' %}
{% block title %}举报{% endblock %}
{% block page_title %}举报处理（最近 100 条）{% endblock %}
{% block content %}

<el-card shadow="never" body-style="padding: 0;">
  <el-table :data="rows">
    <el-table-column label="#" prop="id" width="70"></el-table-column>
    <el-table-column label="对象" prop="target_id" width="160"></el-table-column>
    <el-table-column label="类型" width="160">
      <template #default="scope">[[ reasonLabels[scope.row.reason] || scope.row.reason ]]</template>
    </el-table-column>
    <el-table-column label="补充说明" min-width="200">
      <template #default="scope">[[ scope.row.detail || '—' ]]</template>
    </el-table-column>
    <el-table-column label="时间" prop="created_at" width="160"></el-table-column>
    <el-table-column label="状态" width="100">
      <template #default="scope">
        <el-tag v-if="scope.row.status === 'open'" type="warning" size="small">待处理</el-tag>
        <el-tag v-else type="info" size="small">已处理</el-tag>
      </template>
    </el-table-column>
    <el-table-column label="操作" width="120">
      <template #default="scope">
        <el-button v-if="scope.row.status === 'open'" size="small" link type="primary"
                   @click="post('/reports/' + scope.row.id + '/close')">标记已处理</el-button>
      </template>
    </el-table-column>
  </el-table>
</el-card>

<p style="color: #909399; font-size: 13px;">
  小程序端举报通过云函数 reportContent 写入云上 reports 集合；本页为本地运营库镜像，可用「导入导出」同步。
</p>
{% endblock %}
{% block page_setup %}
<script>
window.PAGE_SETUP = function () {
  return { data: function () { return {
    rows: {{ rows|jsonable|tojson }},
    reasonLabels: {{ reason_labels|tojson }}
  }; } };
};
</script>
{% endblock %}
