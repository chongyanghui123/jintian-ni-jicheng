<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}看板{% endblock %} · 今天你几成运营后台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.get('user') %}
<nav>
  <a class="brand" href="{{ url_for('dashboard') }}">今天你几成 · 运营后台</a>
  <div class="nav-links">
    <a href="{{ url_for('dashboard') }}">看板</a>
    <a href="{{ url_for('questions') }}">题库</a>
    <a href="{{ url_for('schedule') }}">排期</a>
    <a href="{{ url_for('submissions') }}">投稿审核</a>
    <a href="{{ url_for('comments') }}">短评</a>
    <a href="{{ url_for('reports') }}">举报</a>
    <a href="{{ url_for('prizes') }}">奖品</a>
    <a href="{{ url_for('orders') }}">兑换订单</a>
    <a href="{{ url_for('import_export') }}">导入导出</a>
    <a href="{{ url_for('logout') }}">退出</a>
  </div>
</nav>
{% endif %}
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
