{% extends 'base.html' %}
{% block title %}题库{% endblock %}
{% block page_title %}题库（[[ total ]]）{% endblock %}
{% block content %}

<el-card shadow="never" class="mb16">
  <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
    <el-tabs :model-value="tab" @tab-change="onTab" style="flex: 1;">
      <el-tab-pane label="全部" name="all"></el-tab-pane>
      <el-tab-pane label="草稿" name="draft"></el-tab-pane>
      <el-tab-pane label="已排期待上墙" name="scheduled"></el-tab-pane>
      <el-tab-pane label="已上墙" name="live"></el-tab-pane>
    </el-tabs>
    <el-button type="primary" size="small" @click="go('{{ url_for('question_new') }}')">新增题目</el-button>
  </div>
  <div style="display: flex; align-items: center; gap: 8px;">
    <el-input v-model="qInput" placeholder="搜索题干 / 选项 / 题目 ID" style="width: 260px;"
              @keyup.enter="doSearch" clearable></el-input>
    <el-button type="primary" size="small" @click="doSearch">搜索</el-button>
    <el-button v-if="q" size="small" @click="doSearch('')">清除</el-button>
  </div>
</el-card>

<el-card shadow="never" body-style="padding: 0;">
  <el-table :data="rows">
    <el-table-column label="ID" prop="id" width="110"></el-table-column>
    <el-table-column label="题干" min-width="200">
      <template #default="scope">
        [[ scope.row.title ]]
        <el-tag v-if="lockedIds.indexOf(scope.row.id) >= 0" size="small" type="info">已上墙锁定</el-tag>
      </template>
    </el-table-column>
    <el-table-column label="选项 A" prop="optionA" width="120"></el-table-column>
    <el-table-column label="选项 B" prop="optionB" width="120"></el-table-column>
    <el-table-column label="排期" width="110">
      <template #default="scope">[[ scope.row.show_date || '—' ]]</template>
    </el-table-column>
    <el-table-column label="状态" width="90">
      <template #default="scope">
        <el-tag v-if="scope.row.status === 'published'"
                :type="scope.row.show_date && scope.row.show_date <= today ? 'success' : 'warning'"
                size="small">[[ scope.row.show_date && scope.row.show_date <= today ? '已上墙' : '已排期' ]]</el-tag>
        <el-tag v-else type="info" size="small">草稿</el-tag>
      </template>
    </el-table-column>
    <el-table-column label="操作" width="200">
      <template #default="scope">
        <el-button size="small" link type="primary"
                   @click="go('/questions/' + scope.row.id + '/edit')">编辑</el-button>
        <template v-if="lockedIds.indexOf(scope.row.id) < 0">
          <el-button v-if="scope.row.status === 'published'" size="small" link
                     @click="post('/questions/' + scope.row.id + '/status')">下架</el-button>
          <template v-else>
            <el-button size="small" link type="primary"
                       @click="post('/questions/' + scope.row.id + '/status')">上架</el-button>
            <el-button size="small" link type="danger"
                       @click="askPost('确认删除题目 ' + scope.row.id + '？', '/questions/' + scope.row.id + '/delete')">删除</el-button>
          </template>
        </template>
      </template>
    </el-table-column>
  </el-table>
</el-card>

<div style="margin-top: 16px; display: flex; justify-content: flex-end;">
  <el-pagination v-if="pages > 1" background layout="total, prev, pager, next"
                 :total="total" :page-size="20" :current-page="page"
                 @current-change="gotoPage"></el-pagination>
</div>
{% endblock %}
{% block page_setup %}
<script>
window.PAGE_SETUP = function () {
  return { data: function () { return {
    rows: {{ rows|jsonable|tojson }},
    tab: {{ tab|tojson }},
    q: {{ q|tojson }},
    qInput: {{ q|tojson }},
    page: {{ page|tojson }},
    pages: {{ pages|tojson }},
    total: {{ total|tojson }},
    today: {{ today|tojson }},
    lockedIds: {{ locked_ids|list|jsonable|tojson }}
  }; },
  methods: {
    onTab: function (t) {
      var u = new URL(window.location.href);
      u.searchParams.set('tab', t);
      u.searchParams.delete('page');
      window.location.href = u.pathname + '?' + u.searchParams.toString();
    },
    doSearch: function (kw) {
      var u = new URL(window.location.href);
      var v = (kw === undefined ? this.qInput : kw).trim();
      if (v) { u.searchParams.set('q', v); } else { u.searchParams.delete('q'); }
      u.searchParams.delete('page');
      window.location.href = u.pathname + '?' + u.searchParams.toString();
    }
  } };
};
</script>
{% endblock %}
