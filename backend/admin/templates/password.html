{% extends 'base.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}
<el-card shadow="never">
  <div class="card-head"><h3>修改管理密码</h3></div>
  <form method="post" style="max-width: 420px;" @submit="submitPwd">
    <p><el-input name="old_password" type="password" v-model="form.old"
                 placeholder="当前密码" show-password></el-input></p>
    <p><el-input name="new_password" type="password" v-model="form.new"
                 placeholder="新密码（至少 8 位）" show-password></el-input></p>
    <p><el-input name="confirm_password" type="password" v-model="form.confirm"
                 placeholder="确认新密码" show-password></el-input></p>
    <p><el-button type="primary" native-type="submit">保存新密码</el-button></p>
  </form>
</el-card>
{% endblock %}
{% block page_setup %}
<script>
window.PAGE_SETUP = function () {
  return {
    data: function () { return { form: { old: '', new: '', confirm: '' } }; },
    methods: {
      submitPwd: function (e) {
        if (!this.form.old) { e.preventDefault(); this.$message.error('请输入当前密码'); return; }
        if (!this.form.new || this.form.new.length < 8) { e.preventDefault(); this.$message.error('新密码至少 8 位'); return; }
        if (this.form.new !== this.form.confirm) { e.preventDefault(); this.$message.error('两次输入的新密码不一致'); return; }
      }
    }
  };
};
</script>
{% endblock %}
