{% extends 'base.html' %}
{% block title %}积分规则{% endblock %}
{% block page_title %}积分规则（历史兼容 / 应急开关）{% endblock %}
{% block content %}

<el-alert type="info" :closable="false" show-icon class="mb16"
          title="答完题同时发放「积分」和「转盘抽奖次数」。答题积分在这里调整，抽奖次数与转盘奖品在「运营设置」「转盘奖品」中调整。"></el-alert>

<el-card shadow="never" style="max-width: 640px;">
  <el-form label-width="160px">
    <el-form-item label="每日答题得分" required>
      <el-input-number v-model="form.points_answer" :min="0" :max="1000"></el-input-number>
      <span style="color: #909399; font-size: 12px; margin-left: 10px;">答完当天题目发放的积分</span>
    </el-form-item>
    <el-form-item label="连答 7 天奖励" required>
      <el-input-number v-model="form.points_streak7" :min="0" :max="1000"></el-input-number>
      <span style="color: #909399; font-size: 12px; margin-left: 10px;">连答满 7 天额外发放的积分</span>
    </el-form-item>
    <el-form-item label="单日获取上限" required>
      <el-input-number v-model="form.points_daily_cap" :min="0" :max="100000"></el-input-number>
      <span style="color: #909399; font-size: 12px; margin-left: 10px;">当天累计获得达到上限后不再发放</span>
    </el-form-item>
    <el-form-item>
      <el-button type="primary" @click="save">保存</el-button>
      <el-button @click="go('/points-rules')">重置</el-button>
    </el-form-item>
  </el-form>
</el-card>

{% endblock %}
{% block page_setup %}
<script>
window.PAGE_SETUP = function () {
  return { data: function () { return {
    action: {{ url_for('points_rules')|tojson }},
    form: {
      points_answer: {{ values['points_answer']|tojson }},
      points_streak7: {{ values['points_streak7']|tojson }},
      points_daily_cap: {{ values['points_daily_cap']|tojson }}
    }
  }; },
  methods: {
    save: function () {
      this.post(this.action, this.form);
    }
  } };
};
</script>
{% endblock %}
