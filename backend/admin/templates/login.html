{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 80px auto;">
  <h1>运营后台登录</h1>
  <form method="post">
    <label>管理密码</label>
    <input type="password" name="password" style="width: 100%;" autofocus required>
    <p class="muted">默认 admin123，生产环境请设置环境变量 ADMIN_PASSWORD</p>
    <p style="margin-top: 16px;">
      <button class="btn btn-primary" type="submit">登录</button>
    </p>
  </form>
</div>
{% endblock %}
